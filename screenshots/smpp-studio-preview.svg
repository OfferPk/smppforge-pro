  <rect x="70" y="530" width="480" height="80" rx="8" fill="#03060c" stroke="#213358" stroke-width="1"/>
  <text x="85" y="560" font-family="monospace" font-size="13" font-weight="bold" fill="#00e5ff">00 00 00 5D 00 00 00 04 00 00 00 00 00 00 00 01</text>
  <text x="85" y="585" font-family="monospace" font-size="11" fill="#8ea1c4">LEN:93 | CMD:submit_sm | STAT:0 (OK) | SEQ:1 | SRC:ALERT_OTP</text>

