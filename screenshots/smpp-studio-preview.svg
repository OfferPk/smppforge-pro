  <text x="770" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#8ea1c4" text-anchor="middle">GSMA / 10DLC Auditor</text>
  <text x="940" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#8ea1c4" text-anchor="middle">Gateway &amp; IDS Rules</text>
