  <text x="335" y="354" font-family="monospace" font-size="13" fill="#00e676">+971 50 123 4567</text>

  <text x="70" y="400" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#8ea1c4">MESSAGE PAYLOAD</text>
  <rect x="70" y="410" width="480" height="70" rx="6" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="85" y="435" font-family="monospace" font-size="12" fill="#f0f4fc">Your verification code is 849201. Valid for 5 mins.</text>
  <text x="85" y="455" font-family="monospace" font-size="12" fill="#8ea1c4">Reply STOP to opt out.</text>

