  <text x="45" y="41" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#070b14" text-anchor="middle">📡</text>
  <text x="80" y="42" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#f0f4fc">SMPPForge <tspan fill="#00e5ff">Pro</tspan></text>
  <text x="245" y="42" font-family="monospace" font-size="12" fill="#8ea1c4">v1.0.0 | SMPP v3.4 / v5.0 Telecom Protocol Studio &amp; A2P 10DLC Auditor</text>
  
  <!-- Status Badge -->
