  <text x="660" y="670" font-family="monospace" font-size="11" fill="#00e5ff"># Linux nftables Telecom Ingress Rule</text>
  <text x="660" y="690" font-family="monospace" font-size="11" fill="#f0f4fc">tcp dport { 2775, 3550 } tcp flags syn limit rate 50/sec accept</text>
  <text x="660" y="710" font-family="monospace" font-size="11" fill="#8ea1c4">ip saddr @allowed_aggregators tcp dport 3550 ct state new accept</text>
