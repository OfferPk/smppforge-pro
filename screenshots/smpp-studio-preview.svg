  <circle cx="665" cy="545" r="9" fill="#064e3b"/>
  <text x="665" y="550" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00e676" text-anchor="middle">✓</text>
  <text x="690" y="540" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f4fc">Throughput Rate Limiting &amp; Pacing</text>
  <text x="690" y="556" font-family="-apple-system, sans-serif" font-size="11" fill="#8ea1c4">Token bucket pacing prevents ESME_RTHROTTLED (0x58)</text>
  <text x="1080" y="550" font-family="monospace" font-size="11" font-weight="bold" fill="#00e676">PASSED</text>

  <rect x="640" y="580" width="490" height="50" rx="6" fill="#091021" stroke="#00e676" stroke-width="1"/>
  <circle cx="665" cy="605" r="9" fill="#064e3b"/>
