  <text x="690" y="600" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f4fc">Smishing &amp; Malicious URL Filtering</text>
  <text x="690" y="616" font-family="-apple-system, sans-serif" font-size="11" fill="#8ea1c4">Branded TLS shorteners verified; public bit.ly blocked</text>
