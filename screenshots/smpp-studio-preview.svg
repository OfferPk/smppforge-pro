  <text x="110" y="98" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00e5ff" text-anchor="middle">PDU Synthesizer</text>
  
  <text x="270" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#8ea1c4" text-anchor="middle">PDU Dissector</text>
