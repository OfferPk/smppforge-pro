<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f1930"/>
    </linearGradient>
    <linearGradient id="esmeG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="smscG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="linkG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#bgD)"/>

  <!-- Title -->
  <text x="550" y="45" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#f0f4fc" text-anchor="middle">SMPP v3.4 / v5.0 Telecommunications Architecture &amp; Threat Model</text>
  <text x="550" y="70" font-family="monospace" font-size="13" fill="#8ea1c4" text-anchor="middle">Carrier Interconnects, A2P 10DLC Gating &amp; Anti-Smishing Threat Boundaries</text>

  <!-- Threat Area (Plaintext Vulnerabilities) -->
  <rect x="50" y="100" width="1000" height="150" rx="8" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="70" y="125" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f87171">VULNERABILITY: UNENCRYPTED PLAINTEXT SMPP (TCP PORT 2775)</text>

  <!-- ESME Plain -->
  <rect x="70" y="145" width="220" height="85" rx="6" fill="#131f38" stroke="#213358" stroke-width="1"/>
  <text x="180" y="175" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f4fc" text-anchor="middle">Unencrypted ESME Client</text>
  <text x="180" y="195" font-family="monospace" font-size="11" fill="#8ea1c4" text-anchor="middle">system_id: admin | pass: 123</text>

  <!-- Wire -->
  <line x1="290" y1="187" x2="800" y2="187" stroke="#ef4444" stroke-width="3"/>
  <text x="490" y="175" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">Cleartext TCP Socket 2775 (Credentials Sniffable)</text>

  <!-- Intercept Box -->
  <rect x="470" y="180" width="180" height="50" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1"/>
  <text x="560" y="200" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fee2e2" text-anchor="middle">⚠️ Man-in-the-Middle</text>
  <text x="560" y="218" font-family="monospace" font-size="10" fill="#fecaca" text-anchor="middle">OTP Intercept &amp; Spoof</text>

  <!-- SMSC Plain -->
  <rect x="800" y="145" width="220" height="85" rx="6" fill="#131f38" stroke="#213358" stroke-width="1"/>
  <text x="910" y="175" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f4fc" text-anchor="middle">Legacy SMSC Gateway</text>
  <text x="910" y="195" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">No 10DLC Vetting</text>

  <!-- Secure Architecture Area -->
  <rect x="50" y="280" width="1000" height="330" rx="8" fill="#022c22" fill-opacity="0.3" stroke="#00e676" stroke-width="1"/>
  <text x="70" y="310" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00e676">CARRIER-GRADE SMPP PROTOCOL &amp; REGULATORY SECURITY GATEWAY (GSMA FS.19)</text>

  <!-- ESME Secure -->
  <rect x="70" y="335" width="260" height="245" rx="8" fill="url(#esmeG)" stroke="#00e5ff" stroke-width="2"/>
  <text x="200" y="370" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Authorized ESME Client</text>
  <text x="200" y="390" font-family="monospace" font-size="11" fill="#00e5ff" text-anchor="middle">Fintech / Bank OTP System</text>
  
  <rect x="90" y="410" width="220" height="40" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="200" y="435" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">GSM 7-bit / UCS-2 Engine</text>

  <rect x="90" y="460" width="220" height="40" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="200" y="485" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">UDH Multi-Part Splitter</text>

  <rect x="90" y="510" width="220" height="45" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="200" y="530" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Token-Bucket Rate Limiter</text>
  <text x="200" y="545" font-family="monospace" font-size="10" fill="#8ea1c4" text-anchor="middle">Max 250 TPS Pacing</text>

  <!-- High-Security Encrypted Interconnect -->
  <line x1="330" y1="455" x2="770" y2="455" stroke="url(#linkG)" stroke-width="5"/>
  <text x="550" y="435" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00e5ff" text-anchor="middle">TLS 1.3 Tunnel (SMPPS Port 3550)</text>
  <text x="550" y="485" font-family="monospace" font-size="11" fill="#00e676" text-anchor="middle">Mutual TLS X.509 + IP Whitelisted Ingress</text>
  <text x="550" y="505" font-family="monospace" font-size="10" fill="#8ea1c4" text-anchor="middle">Suricata L7 DPI Deep Packet Inspection Active</text>

  <!-- SMSC Secure -->
  <rect x="770" y="335" width="260" height="245" rx="8" fill="url(#smscG)" stroke="#00e676" stroke-width="2"/>
  <text x="900" y="370" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Carrier Core SMSC</text>
  <text x="900" y="390" font-family="monospace" font-size="11" fill="#00e676" text-anchor="middle">MNO / Aggregator Hub</text>

  <rect x="790" y="410" width="220" height="40" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="900" y="435" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">A2P 10DLC Campaign Vetting</text>

  <rect x="790" y="460" width="220" height="40" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="900" y="485" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">TDRA / Ofcom Sender ID Filter</text>

  <rect x="790" y="510" width="220" height="45" rx="4" fill="#070b14" stroke="#213358" stroke-width="1"/>
  <text x="900" y="530" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Anti-Smishing Phishing Filter</text>
  <text x="900" y="545" font-family="monospace" font-size="10" fill="#8ea1c4" text-anchor="middle">SS7 / MAP Mobile Core Delivery</text>
</svg>
